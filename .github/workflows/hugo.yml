# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  pull_request:
    branches: ["master"]

  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Keep pull requests separate from production deployments; cancel stale PR validations only.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Validate pull requests with the deployment Hugo version.
  validate:
    if: github.event_name == 'pull_request'
    # Pin the runner while Playwright 1.60.0 lacks Ubuntu 26.04 Firefox dependencies.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build CSS
        run: npm run build:css
      - name: Build production site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --cleanDestinationDir --config config.yaml,config.production.yaml
      - name: Validate Hugo routes and templates
        run: npm run validate
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Smoke test production build
        run: npm test
      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
      - name: Test critical journeys
        run: npm run test:journeys

  # Build job
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Build CSS with PostCSS
        run: npm run build:css
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --gc \
            --cleanDestinationDir \
            --config config.yaml,config.production.yaml \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Test deployment
  test:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Test deployment
        run: |
          chmod +x scripts/test-deployment.sh
          ./scripts/test-deployment.sh https://fellowshipoftheflux.com
