<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ partial "meta.html" . }}
<link rel="icon" href="/images/site-logo.svg" type="image/svg+xml">
<script>
try {
  const preference = localStorage.getItem('color-theme');
  document.documentElement.classList.toggle('dark', preference ? preference === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
} catch {}
</script>
<link rel="stylesheet" href="/css/main.css">
{{ with resources.Get "css/custom.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
