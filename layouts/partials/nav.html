<header class="mast"><div class="frame mast-inner">
<a href="/" class="brand" aria-label="Fellowship of the Flux home"><i class="mark" aria-hidden="true"></i><span>Fellowship<br>of the Flux</span></a>
<button class="menu-switch" aria-expanded="false" aria-controls="primary-nav" hidden>Menu</button>
<nav id="primary-nav" aria-label="Main navigation">
{{ range slice (slice "/learn/" "Learn to solder") (slice "/community/" "Community") (slice "/about/" "About us") (slice "/services/" "Host a workshop") }}
<a href="{{ index . 0 }}" {{ if hasPrefix $.RelPermalink (index . 0) }}aria-current="{{ if eq $.RelPermalink (index . 0) }}page{{ else }}location{{ end }}"{{ end }}>{{ index . 1 }}{{ if eq (index . 0) "/services/" }} <span aria-hidden="true">↗</span>{{ end }}</a>
{{ end }}
</nav>
<button class="theme-switch" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden><span aria-hidden="true">◐</span></button>
</div></header>
